## Déploiement Render — voir DEPLOY_RENDER.md à la racine de ce dépôt pour
## le mode d'emploi complet (import du blueprint, récupération du mot de
## passe admin généré, limites connues).
##
## Noms de service préfixés `keya-ecosystem-` (pas juste `keya-`) : le
## compte Render utilisé a déjà un AUTRE projet actif nommé `keya-backend`
## (dépôt `osarr14-coder/KEYA`, domaine keyimmoafric.com, plan payant) —
## collision réelle rencontrée en déployant, qui aurait fait écraser sa
## configuration par celle-ci si on avait laissé les noms courts. Noms
## FIXES et PRÉDICTIBLES (https://<name>.onrender.com) : permet de câbler
## CORS_ALLOWED_ORIGINS et les 4 VITE_*_URL directement dans ce fichier —
## si ces noms sont malgré tout déjà pris sur votre compte Render,
## renommez-les de façon cohérente ET mettez à jour les env vars qui les
## référencent plus bas (elles ne se déduisent pas automatiquement).

databases:
  # Plan payant (pas free) : le compte Render utilisé a déjà une base
  # gratuite active pour un AUTRE projet en production (KEYA/keyimmoafric.com,
  # modèle économique distinct de KEYA ECOSYSTEM) — "cannot have more than
  # one active free tier database" rencontré en déployant. `basic-256mb` est
  # le plan payant le moins cher chez Render à la rédaction de ce fichier,
  # largement suffisant pour un usage de test/pilote.
  - name: keya-ecosystem-db
    plan: basic-256mb
    databaseName: keya_ecosystem
    user: keya_ecosystem_app

services:
  # ── Backend Django (API + admin) ──────────────────────────────────────
  - type: web
    name: keya-ecosystem-backend
    runtime: python
    plan: free
    rootDir: backend
    # `preDeployCommand` (l'endroit normal pour migrate/seed, après le
    # build, avant que la nouvelle version ne reçoive du trafic) n'existe
    # que sur les plans PAYANTS Render — vérifié avant d'écrire ce fichier,
    # pas supposé. Sur le plan free (celui utilisé ici), tout tourne donc
    # dans buildCommand — seul environnement de build qui a accès réseau à
    # la base. Voir apps/organizations/management/commands/seed_admin.py.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_admin"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: keya-ecosystem-backend.onrender.com
      - key: DB_NAME
        fromDatabase: { name: keya-ecosystem-db, property: database }
      - key: DB_USER
        fromDatabase: { name: keya-ecosystem-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: keya-ecosystem-db, property: password }
      - key: DB_HOST
        fromDatabase: { name: keya-ecosystem-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: keya-ecosystem-db, property: port }
      - key: CORS_ALLOWED_ORIGINS
        value: https://keya-ecosystem-home.onrender.com,https://keya-ecosystem-build.onrender.com,https://keya-ecosystem-control.onrender.com,https://keya-ecosystem-web.onrender.com
      # Simplification assumée pour ce premier déploiement (voir
      # DEPLOY_RENDER.md, section "Limites connues") : évite un service
      # Redis + worker Celery séparés (coût, complexité) pour un besoin
      # aujourd'hui limité au traitement média (ticket 004) — les tâches
      # tournent en synchrone dans la requête plutôt qu'en arrière-plan.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true

  # ── HOME (client) ──────────────────────────────────────────────────────
  - type: web
    name: keya-ecosystem-home
    runtime: static
    # Pas de `plan:` ici : contrairement à un service `runtime: python`, un
    # site statique Render n'a pas de notion de plan payant/gratuit — il est
    # gratuit par nature. Poser `plan: free` explicitement fait échouer
    # l'import du Blueprint ("no such plan free for service type web") —
    # erreur réelle rencontrée en déployant, pas anticipée à l'écriture de
    # ce fichier.
    buildCommand: "npm ci && npm run build --workspace=apps/home"
    staticPublishPath: apps/home/dist
    envVars: &frontend-env-vars
      - key: VITE_API_BASE_URL
        value: https://keya-ecosystem-backend.onrender.com
      - key: VITE_HOME_URL
        value: https://keya-ecosystem-home.onrender.com
      - key: VITE_BUILD_URL
        value: https://keya-ecosystem-build.onrender.com
      - key: VITE_CONTROL_URL
        value: https://keya-ecosystem-control.onrender.com
      - key: VITE_WEB_URL
        value: https://keya-ecosystem-web.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── BUILD (constructeur) ────────────────────────────────────────────────
  - type: web
    name: keya-ecosystem-build
    runtime: static
    buildCommand: "npm ci && npm run build --workspace=apps/build"
    staticPublishPath: apps/build/dist
    envVars: *frontend-env-vars
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── CONTROL PWA (inspecteur) ────────────────────────────────────────────
  - type: web
    name: keya-ecosystem-control
    runtime: static
    buildCommand: "npm ci && npm run build --workspace=apps/control-pwa"
    staticPublishPath: apps/control-pwa/dist
    envVars: *frontend-env-vars
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── apps/web (back-office + devis/tarifs/paliers) ───────────────────────
  - type: web
    name: keya-ecosystem-web
    runtime: static
    buildCommand: "npm ci && npm run build --workspace=apps/web"
    staticPublishPath: apps/web/dist
    envVars: *frontend-env-vars
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

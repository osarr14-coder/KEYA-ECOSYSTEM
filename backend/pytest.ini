[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Par défaut, pytest exclut tout dossier nommé exactement "build" de la
# découverte automatique (norecursedirs par défaut inclut 'build', pensé
# pour des répertoires de sortie de compilation) — ce qui excluait
# SILENCIEUSEMENT apps/build/tests.py (app du ticket 009) de toute la suite
# complète, alors que `pytest apps/build` seul le trouvait bien (un chemin
# explicite contourne norecursedirs). Repris ici sans 'build' — piège
# découvert en vérifiant que le nombre de tests collectés par la suite
# complète correspondait bien à la somme des suites par app.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch}
